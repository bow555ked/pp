<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนนักศึกษา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-lg p-6 md:p-8">
        <div class="border-b pb-4 mb-6">
            <h1 class="text-2xl font-bold text-slate-800">แบบฟอร์มลงทะเบียนนักศึกษา</h1>
            <p class="text-sm text-slate-500 mt-1">กรุณากรอกข้อมูลให้ครบถ้วนทั้ง 8 รายการ</p>
        </div>

        <!-- กล่องแจ้งเตือนสถานะ -->
        <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

        <form id="registerForm" class="space-y-4">
            <!-- 1. ชื่อ และ 2. นามสกุล -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อ *</label>
                    <input type="text" id="firstName" required placeholder="ระบุชื่อจริง"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">นามสกุล *</label>
                    <input type="text" id="lastName" required placeholder="ระบุนามสกุล"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
            </div>

            <!-- 3. เลขนักศึกษา และ 4. อายุ -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">เลขนักศึกษา *</label>
                    <input type="text" id="studentId" required placeholder="เช่น 67209010001"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">อายุ (ปี) *</label>
                    <input type="number" id="age" required min="15" max="99" placeholder="เช่น 19"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
            </div>

            <!-- 5. แผนก และ 6. สาขา -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">แผนกวิชา *</label>
                    <input type="text" id="department" required placeholder="เช่น เทคโนโลยีสารสนเทศ"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">สาขางาน *</label>
                    <input type="text" id="major" required placeholder="เช่น นักพัฒนาซอฟต์แวร์"
                        class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
            </div>

            <!-- 7. ระดับชั้น -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ระดับชั้น *</label>
                <select id="gradeLevel" required
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-white">
                    <option value="">-- เลือกระดับชั้น --</option>
                    <option value="ปวช. 1">ปวช. 1</option>
                    <option value="ปวช. 2">ปวช. 2</option>
                    <option value="ปวช. 3">ปวช. 3</option>
                    <option value="ปวส. 1">ปวส. 1</option>
                    <option value="ปวส. 2">ปวส. 2</option>
                    <option value="ปริญญาตรี">ปริญญาตรี</option>
                </select>
            </div>

            <!-- 8. คติประจำใจ -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">คติประจำใจ *</label>
                <textarea id="motto" rows="3" required placeholder="พิมพ์คติประจำใจของคุณ..."
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"></textarea>
            </div>

            <!-- ปุ่มบันทึกและล้างฟอร์ม -->
            <div class="pt-4 flex flex-col sm:flex-row gap-3">
                <button type="submit"
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-md">
                    บันทึกข้อมูลลงทะเบียน
                </button>
                <button type="reset"
                    class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-3 px-6 rounded-xl transition duration-200">
                    ล้างข้อมูล
                </button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');

        // ฟังก์ชันแสดงข้อความแจ้งเตือน
        function showAlert(message, isSuccess) {
            alertBox.textContent = message;
            alertBox.className = `mb-6 p-4 rounded-xl text-sm font-medium ${
                isSuccess 
                ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' 
                : 'bg-rose-100 text-rose-800 border border-rose-200'
            }`;
            alertBox.classList.remove('hidden');
            
            // ซ่อนแจ้งเตือนอัตโนมัติหลัง 4 วินาที
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 4000);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // ดึงค่าจากฟอร์มและตัดช่องว่างหัวท้าย
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const studentId = document.getElementById('studentId').value.trim();
            const age = document.getElementById('age').value.trim();
            const department = document.getElementById('department').value.trim();
            const major = document.getElementById('major').value.trim();
            const gradeLevel = document.getElementById('gradeLevel').value;
            const motto = document.getElementById('motto').value.trim();

            // 1. ตรวจสอบความถูกต้องของเลขนักศึกษา (ต้องเป็นตัวเลขเท่านั้น)
            if (!/^\d+$/.test(studentId)) {
                showAlert('❌ เลขนักศึกษาต้องเป็นตัวเลขเท่านั้น', false);
                return;
            }

            // 2. ดึงข้อมูลเก่าจาก LocalStorage มาตรวจสอบเลขซ้ำ
            const students = JSON.parse(localStorage.getItem('students_data')) || [];
            const isDuplicate = students.some(student => student.studentId === studentId);

            if (isDuplicate) {
                showAlert(`❌ เลขนักศึกษา ${studentId} มีอยู่ในระบบแล้ว กรุณาตรวจสอบอีกครั้ง`, false);
                return;
            }

            // 3. สร้างออบเจกต์ข้อมูลนักศึกษาใหม่
            const newStudent = {
                id: Date.now(),
                firstName,
                lastName,
                studentId,
                age: Number(age),
                department,
                major,
                gradeLevel,
                motto,
                createdAt: new Date().toLocaleString('th-TH')
            };

            // 4. บันทึกลง LocalStorage
            students.push(newStudent);
            localStorage.setItem('students_data', JSON.stringify(students));

            // แจ้งเตือนสำเร็จและรีเซ็ตฟอร์ม
            showAlert(`✅ ลงทะเบียนคุณ ${firstName} ${lastName} เรียบร้อยแล้ว!`, true);
            form.reset();
        });
    </script>
</body>
</html>
